{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Omniverse{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    {% if messages %}<div class="standalone-messages">{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}

    {% block content %}
    {% endblock %}

</body>

</html>
