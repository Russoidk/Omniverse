<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciando Omniverse</title>
<style>
  :root{color-scheme:dark;--bg:#0b0b10;--panel:#111116;--line:#302b35;--muted:#96919e;--red:#ff3155;--pink:#f07a9a}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0}
  body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#25101b 0%,#111016 43%,#09090d 100%);color:#f5f1f6;font-family:Segoe UI,Arial,sans-serif}
  .frame{position:relative;width:calc(100% - 28px);height:calc(100% - 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:1px solid #49303c;border-radius:20px;background:linear-gradient(145deg,#17141bdb,#0d0d12f5 70%);box-shadow:0 20px 65px #0009,inset 0 0 40px #ff31550b}
  .frame:before,.frame:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(75px);opacity:.12;pointer-events:none}
  .frame:before{top:-160px;left:-90px;background:#ff3155}.frame:after{right:-130px;bottom:-170px;background:#aa315b}
  .brand{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
  .logo-shell{width:138px;height:138px;display:grid;place-items:center;border:1px solid #6d3447;border-radius:32px;background:linear-gradient(145deg,#211821,#101015);box-shadow:0 0 42px #ff315525,inset 0 0 24px #ff31550c}
  .logo{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 0 18px #ff31554d)}
  .wordmark{margin-top:8px;font-size:24px;font-weight:750;letter-spacing:5px}.wordmark span{color:var(--pink)}
  .tagline{margin-top:2px;color:#bcb4c0;font-size:10px;font-weight:650;letter-spacing:3px;text-transform:uppercase}
  .separator{width:210px;height:1px;margin:26px 0 20px;background:linear-gradient(90deg,transparent,#80344b,transparent)}
  .status{font-size:13px;font-weight:600;letter-spacing:.2px}.detail{margin-top:8px;color:var(--muted);font-size:11px;text-align:center;line-height:1.6}
  .loader{width:220px;height:4px;margin-top:22px;overflow:hidden;border-radius:99px;background:#30242e}
  .loader:after{content:"";display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,#e82b50,#ff83a0);box-shadow:0 0 14px #ff3155;animation:loading 1.55s ease-in-out infinite}
  .footer{position:absolute;bottom:20px;color:#69636f;font-size:9px;letter-spacing:1.8px;text-transform:uppercase}
  @keyframes loading{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}
  @media(prefers-reduced-motion:reduce){.loader:after{animation:none;width:65%}}
</style>
</head>
<body>
  <main class="frame">
    <div class="brand">
      <div class="logo-shell"><img class="logo" src="static/images/omniverse-logo.png" alt="Logo de Omniverse"></div>
      <div class="wordmark">OMNI<span>VERSE</span></div>
      <div class="tagline">Forja de Mundos</div>
    </div>
    <div class="separator"></div>
    <div class="status">Preparando tu espacio creativo</div>
    <div class="detail">Omniverse está iniciando sus componentes locales.<br>La primera ejecución puede tardar un poco más.</div>
    <div class="loader" aria-label="Cargando"></div>
    <div class="footer">Un universo de posibilidades</div>
  </main>
</body>
</html>
